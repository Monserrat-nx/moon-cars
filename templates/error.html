{% extends "plantilla.html" %}

{% block titulo %}Error {{ codigo }} - Moon-cars{% endblock %}

{% block contenido %}

    <!-- PÁGINA DE ERROR (404 / 500) -->

    <section class="pagina-error">

        <div class="card tarjeta-mc text-center">

            <div class="card-body p-4 p-md-5">

                <i class="fa-solid {{ icono }} fa-4x icono-error"></i>

                <p class="codigo-error mb-0">{{ codigo }}</p>

                <h2 class="titulo-formulario mb-3">{{ titulo_error }}</h2>

                <p class="text-secondary mb-4">{{ mensaje }}</p>

                <div class="d-flex flex-wrap justify-content-center gap-2">

                    <a href="{{ url_for('inicio') }}" class="btn btn-primary">
                        <i class="fa-solid fa-house"></i> Ir al inicio
                    </a>

                    <a href="{{ url_for('catalogo') }}" class="btn btn-outline-primary">
                        <i class="fa-solid fa-car"></i> Ver catálogo
                    </a>

                </div>

            </div>

        </div>

    </section>

{% endblock %}
