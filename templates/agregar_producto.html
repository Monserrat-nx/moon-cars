{% extends "plantilla.html" %}

{% block titulo %}Agregar producto - Moon-cars{% endblock %}

{% block contenido %}

    <!-- AGREGAR PRODUCTO -->

    <div class="card tarjeta-mc tarjeta-formulario tarjeta-formulario-ancha">

        <div class="card-body p-4 p-md-5">

            <h2 class="text-center titulo-formulario">
                <i class="fa-solid fa-box-open"></i> Agregar producto
            </h2>


            <form method="POST"
                  enctype="multipart/form-data"
                  id="formProducto">

                <div class="mb-3">

                    <label for="nombre" class="form-label fw-bold">Nombre del producto:</label>

                    <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        name="nombre"
                        value="{{ datos.nombre or '' }}"
                        placeholder="Ej. Mustang GT"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="row g-3 mb-3">

                    <div class="col-md-6">

                        <label for="marca" class="form-label fw-bold">Marca:</label>

                        <input
                            type="text"
                            class="form-control"
                            id="marca"
                            name="marca"
                            value="{{ datos.marca or '' }}"
                            placeholder="Ej. Ford"
                            maxlength="60"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label for="categoria_id" class="form-label fw-bold">Categoría:</label>

                        <select id="categoria_id" name="categoria_id" class="form-select" required>

                            <option value="">Selecciona una categoría</option>

                            {% for categoria in categorias %}

                                <option
                                    value="{{ categoria.id }}"
                                    {% if datos.categoria_id == categoria.id|string %}selected{% endif %}
                                >
                                    {{ categoria.nombre }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <div class="row g-3 mb-3">

                    <div class="col-md-6">

                        <label for="precio" class="form-label fw-bold">Precio (MXN):</label>

                        <div class="input-group">

                            <span class="input-group-text">$</span>

                            <input
                                type="number"
                                class="form-control"
                                id="precio"
                                name="precio"
                                value="{{ datos.precio or '' }}"
                                min="0"
                                step="0.01"
                                placeholder="0.00"
                                required
                            >

                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="stock" class="form-label fw-bold">Stock:</label>

                        <div class="input-group">

                            <span class="input-group-text"><i class="fa-solid fa-boxes-stacked"></i></span>

                            <input
                                type="number"
                                class="form-control"
                                id="stock"
                                name="stock"
                                value="{{ datos.stock or '' }}"
                                min="0"
                                step="1"
                                placeholder="0"
                                required
                            >

                        </div>

                    </div>

                </div>


                <div class="mb-3">

                    <label for="descripcion" class="form-label fw-bold">Descripción:</label>

                    <textarea
                        class="form-control"
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        placeholder="Características del producto"
                    >{{ datos.descripcion or '' }}</textarea>

                </div>


                <div class="mb-3">

                    <label for="imagen" class="form-label fw-bold">
                        Imagen (JPG, PNG, GIF o WEBP, máx. 2 MB):
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="imagen"
                        name="imagen"
                        accept="image/jpeg,image/png,image/gif,image/webp"
                    >

                </div>


                <!-- VISTA PREVIA DE LA IMAGEN -->

                <div class="vista-previa" id="vistaPrevia">
                    <span class="sin-imagen">
                        <i class="fa-regular fa-image fa-2x"></i><br>Sin imagen seleccionada
                    </span>
                </div>


                <button type="submit" class="btn btn-primary w-100 py-2 mt-4">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar producto
                </button>

            </form>


            <p class="text-center mt-4 mb-0">
                <a href="{{ url_for('catalogo') }}">
                    <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
                </a>
            </p>

        </div>

    </div>

{% endblock %}


{% block scripts %}

<script>

const campoImagen = document.getElementById("imagen");
const vistaPrevia = document.getElementById("vistaPrevia");

const TAMANO_MAXIMO = 2 * 1024 * 1024;

const SIN_IMAGEN = '<span class="sin-imagen"><i class="fa-regular fa-image fa-2x"></i><br>Sin imagen seleccionada</span>';


// Mostrar la imagen antes de subirla
campoImagen.addEventListener("change", function() {

    const archivo = campoImagen.files[0];

    if (!archivo) {

        vistaPrevia.innerHTML = SIN_IMAGEN;

        return;
    }

    if (archivo.size > TAMANO_MAXIMO) {

        alert("La imagen es muy grande. El máximo es 2 MB.");

        campoImagen.value = "";

        vistaPrevia.innerHTML = SIN_IMAGEN;

        return;
    }

    const lector = new FileReader();

    lector.onload = function(evento) {

        vistaPrevia.innerHTML = "";

        const imagen = document.createElement("img");

        imagen.src = evento.target.result;
        imagen.alt = "Vista previa";

        vistaPrevia.appendChild(imagen);
    };

    lector.readAsDataURL(archivo);

});


// Validar antes de enviar
document.getElementById("formProducto").addEventListener("submit", function(event) {

    const precio = parseFloat(document.getElementById("precio").value);
    const stock = Number(document.getElementById("stock").value);

    if (isNaN(precio) || precio < 0) {

        event.preventDefault();

        alert("El precio debe ser un número mayor o igual a 0.");

        return;
    }

    if (!Number.isInteger(stock) || stock < 0) {

        event.preventDefault();

        alert("El stock debe ser un número entero mayor o igual a 0.");

        return;
    }

});

</script>

{% endblock %}
