{% extends "plantilla.html" %}

{% block titulo %}Contacto - Moon-cars{% endblock %}

{% block contenido %}

    <!-- CONTACTO -->

    <div class="card tarjeta-mc tarjeta-centrada text-center">

        <div class="card-body p-4 p-md-5">

            <h2 class="titulo-seccion d-inline-block">Contacto</h2>

            <p class="text-secondary">
                ¿Tienes alguna pregunta?
                Comunícate con nosotros.
            </p>


            <!-- DATOS DE CONTACTO -->

            <div class="row g-3 mt-2">

                <div class="col-md-4">
                    <div class="dato-contacto">
                        <i class="fa-solid fa-phone fa-2x"></i>
                        <p class="mb-0 mt-2">442-123-4567</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="dato-contacto">
                        <i class="fa-solid fa-envelope fa-2x"></i>
                        <p class="mb-0 mt-2">contacto@mooncars.com</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="dato-contacto">
                        <i class="fa-solid fa-location-dot fa-2x"></i>
                        <p class="mb-0 mt-2">Querétaro, México</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

{% endblock %}
