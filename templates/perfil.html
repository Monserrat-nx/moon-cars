{% extends "plantilla.html" %}

{% block titulo %}Perfil - Moon-cars{% endblock %}

{% block contenido %}

    <!-- PERFIL -->

    <div class="perfil">

        <h2>Mi Perfil</h2>


        {% if usuario %}

            <h3>{{ usuario.nombre }}</h3>

            <p>
                Correo: {{ usuario.correo }}
            </p>

        {% else %}

            <p>
                No has iniciado sesión.
            </p>

            <a href="/login">
                Iniciar sesión
            </a>

        {% endif %}

    </div>

{% endblock %}
