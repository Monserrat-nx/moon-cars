{% extends "plantilla.html" %}

{% block titulo %}Iniciar sesión - Moon-cars{% endblock %}

{% block contenido %}

    <!-- INICIAR SESIÓN -->

    <div class="login">

        <h2>Iniciar sesión</h2>

        <p>Ingresa a tu cuenta de Moon-cars</p>

        {% if mensaje %}
            <p class="aviso aviso-error">{{ mensaje }}</p>
        {% endif %}

        <form method="POST" action="/login">

            <label for="correo">
                Correo electrónico:
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                required
            >

            <label for="password">
                Contraseña:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Escribe tu contraseña"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p>
            ¿No tienes una cuenta?
        </p>

        <a href="/formulario">
            Registrarse
        </a>

    </div>

{% endblock %}
