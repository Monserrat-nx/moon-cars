<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Iniciar sesion - Moon-cars MX</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>Moon-cars</h1>

</header>


<nav>

    <ul>

        <li><a href="/">Inicio</a></li>
        <li><a href="/formulario">Registrarse</a></li>
        <li><a href="/perfil">Perfil</a></li>
        <li><a href="/contacto">Contacto</a></li>

    </ul>

</nav>

<div class="login">

    <h2>Iniciar sesión</h2>

    <p>Ingresa a tu cuenta de Moon-cars</p>

    {% if mensaje %}
        <p class="mensaje">{{ mensaje }}</p>
    {% endif %}

    <form method="POST" action="/login">

        <label for="correo">
            Correo electrónico:
        </label>

        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required
        >

        <label for="password">
            Contraseña:
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Escribe tu contraseña"
            required
        >

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <p>
        ¿No tienes una cuenta?
    </p>

    <a href="/formulario">
        Registrarse
    </a>

</div>
